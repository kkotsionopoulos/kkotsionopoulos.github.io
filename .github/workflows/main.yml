name: VineWatch Simple
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ΑΠΑΡΑΙΤΗΤΟ για να μπορεί να γράψει στο repo
   
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run main.py (Περονόσπορος)
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python main.py

      - name: Run main_oidio.py (Ωίδιο)
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python main_oidio.py

      - name: Run main_scab.py (Φουζικλάδιο)
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python main_scab.py

      - name: Run main_fire.py (Πυρκαγιά)
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: python main_fire.py

      - name: Run SeaWatch Script (Θάλασσα)
        run: python main_sea.py

      # Αυτόματο Commit & Push χωρίς Merge Conflicts!
      - name: Auto Commit & Push Results
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update all disease, fire and sea risk data"
          file_pattern: "result.txt result_oidio.txt result_scab.txt fire_data.json sea_data.json"